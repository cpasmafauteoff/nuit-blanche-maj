<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capteur — Nuit Blanche</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0909; color: #e8e0d8; font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  main { padding: 14px 16px; }
  h1 { margin: 0 0 4px; font-size: 18px; color: #d9261b; letter-spacing: .02em; }
  .note { margin: 0 0 10px; color: #a89c94; font-size: 12px; }
  #etat { margin: 8px 0; font-weight: 600; }
  #etat.ok { color: #8fd18f; }
  #etat.alerte { color: #ffb38a; }
  video { width: 100%; max-height: 190px; object-fit: contain; background: #000; border-radius: 4px; transform: scaleX(-1); }
  video.cache { display: none; }
  .ligne { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  select, button { background: #1d1414; color: #e8e0d8; border: 1px solid #5a2620; border-radius: 4px; padding: 4px 8px; font: inherit; }
  button:hover, select:hover { border-color: #d9261b; }
  #ips { color: #a89c94; font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<main>
  <h1>Capteur de Nuit Blanche</h1>
  <p class="note">Ta webcam est lue ici, sur ce PC. Aucune image ne part : seuls des nombres (yeux, tête, expressions) vont au jeu. Laisse cette fenêtre ouverte pendant que tu joues ; tu peux la mettre derrière le jeu.</p>
  <div id="etat">Démarrage…</div>
  <video id="video" autoplay muted playsinline></video>
  <div class="ligne">
    <select id="cameras" title="Caméra"></select>
    <button id="apercu">Masquer l'aperçu</button>
    <span id="ips"></span>
  </div>
</main>
<script type="module" src="capteur.js"></script>
</body>
</html>
